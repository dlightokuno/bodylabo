# =========================================================
# D/LIGHT BODY LABO（会員ページ）— Netlify 設定
# site/ フォルダの中身をそのまま公開します。ビルド処理はありません。
# 公式サイト（dlightgym.com）とは別のサイトとして運用します。
# =========================================================

[build]
  publish = "site"

# ---------------------------------------------------------
# 検索エンジンに載せない
# HTMLの noindex に加えて、サーバー側からも同じ指示を出しています。
# ---------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ---------------------------------------------------------
# キャッシュ（転送量を抑えるための設定）
#
# 一度見た人のブラウザに保存させて、次からは読み込ませないようにします。
# Netlify の無料枠は転送量にも上限があるので、ここを効かせると消費が減ります。
# ---------------------------------------------------------

# CSSとJS：1日そのまま使い、そのあとは更新の有無だけ確認する。
# 更新があってもファイル名は変わらないので、長くしすぎないようにしています。
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# HTML：毎回サーバーに確認するが、変わっていなければ本文は送られない。
# 記事を直したときに、古いまま表示され続けるのを防ぎます。
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
